<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Background glow & drop shadow -->
    <filter id="shieldGlow" x="-15%" y="-15%" width="130%" height="135%">
      <feDropShadow dx="0" dy="3" stdDeviation="3.5" flood-color="#1e3a8a" flood-opacity="0.35" />
    </filter>

    <!-- Royal Blue to Deep Indigo Gradient -->
    <linearGradient id="shieldGrad" x1="10" y1="4" x2="54" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#3b82f6" />
      <stop offset="35%" stopColor="#2563eb" />
      <stop offset="70%" stopColor="#1d4ed8" />
      <stop offset="100%" stopColor="#1e3a8a" />
    </linearGradient>

    <!-- Top Cyan Glass Highlight -->
    <linearGradient id="cyanBevel" x1="14" y1="6" x2="50" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#38bdf8" />
      <stop offset="50%" stopColor="#0ea5e9" stopOpacity="0.4" />
      <stop offset="100%" stopColor="#2563eb" stopOpacity="0" />
    </linearGradient>

    <!-- Inner Shield Gradient -->
    <linearGradient id="innerShield" x1="16" y1="10" x2="48" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#1e40af" />
      <stop offset="100%" stopColor="#0f172a" />
    </linearGradient>
  </defs>

  <!-- Outer Majestic Shield -->
  <path
    d="M 32 4 L 52 11.5 C 54 12.2 55.5 14.1 55.5 16.4 C 55.5 35.8 45.2 51.6 33.1 59.2 C 32.4 59.6 31.6 59.6 30.9 59.2 C 18.8 51.6 8.5 35.8 8.5 16.4 C 8.5 14.1 10 12.2 12 11.5 L 32 4 Z"
    fill="url(#shieldGrad)"
    filter="url(#shieldGlow)"
  />

  <!-- Subtle Cyan Radiant Rim -->
  <path
    d="M 32 6.5 L 50.5 13.5 C 52 14.1 53 15.5 53 17.2 C 53 34.5 43.6 48.8 32.5 56 C 32.2 56.2 31.8 56.2 31.5 56 C 20.4 48.8 11 34.5 11 17.2 C 11 15.5 12 14.1 13.5 13.5 L 32 6.5 Z"
    stroke="url(#cyanBevel)"
    stroke-width="1.8"
  />

  <!-- Inner Dark Blue Field -->
  <path
    d="M 32 10 L 48 16 C 49 16.4 49.8 17.4 49.8 18.6 C 49.8 33.2 41.5 45.8 32 52 C 22.5 45.8 14.2 33.2 14.2 18.6 C 14.2 17.4 15 16.4 16 16 L 32 10 Z"
    fill="url(#innerShield)"
    fill-opacity="0.5"
  />

  <!-- Top Glass Sheen -->
  <path
    d="M 32 10 L 48 16 C 49 16.4 49.8 17.4 49.8 18.6 C 49.8 26 47 33 42 38 L 22 18 L 32 10 Z"
    fill="#ffffff"
    fill-opacity="0.08"
  />

  <!-- Crisp White Audit Checkmark (Prominent & Clear at 16px) -->
  <path
    d="M 22 31 L 28.5 37.5 L 42 22"
    stroke="#ffffff"
    stroke-width="5.5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Cyan Accent on Checkmark -->
  <path
    d="M 22 31 L 28.5 37.5 L 42 22"
    stroke="#38bdf8"
    stroke-width="2.2"
    stroke-linecap="round"
    stroke-linejoin="round"
    stroke-opacity="0.8"
  />
</svg>