name: Security Rules Isolated Test Suite

on:
  pull_request:
    branches:
      - main
      - feature/auth-tenant-isolation
    paths:
      - 'tests/**'
      - 'firebase.test.json'
      - 'firestore.rules'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/test-security-rules.yml'
  workflow_dispatch:

# Least Privilege: อนุญาตเฉพาะการอ่านโค้ดใน Repository
permissions:
  contents: read

jobs:
  test-security-rules:
    name: Run Firestore Rules Test Suite (Isolated Fixture & Repo Audit)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java Runtime (for Firebase Emulator)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Deterministic Dependencies
        run: npm ci

      # กรณีที่ 1: ทดสอบกับ Fixture (tests/fixtures/firestore.test.rules)
      # วัตถุประสงค์: ยืนยันว่าชุดทดสอบและข้อกำหนดความปลอดภัยของกฎร่างทำงานถูกต้องและต้องผ่านครบ 100%
      - name: 1. Verify Proposed Rules via Fixture (Isolated Fixture Test - Must Pass)
        run: |
          npx firebase-tools --config firebase.test.json emulators:exec --project audit-os-test-isolation --only firestore "npm run test:rules"
        env:
          # ตัวแปรจำลองเฉพาะสำหรับ Emulator (ไม่มีการส่ง Secret ของ Production)
          FIRESTORE_EMULATOR_HOST: "127.0.0.1:8080"
          # ระบุเป้าหมายชัดเจนว่าเป็นการทดสอบกฎร่างจาก fixture (ไม่ได้ยืนยันความปลอดภัยของ production firestore.rules)
          TARGET_RULES_FILE: "tests/fixtures/firestore.test.rules"

      # กรณีที่ 2: ทดสอบกับกฎของ Repository (firestore.rules ที่ root)
      # วัตถุประสงค์: ยืนยันว่าชุดทดสอบสามารถตรวจจับกฎที่ไม่ปลอดภัยใน Repository (allow read, write: if true;)
      # หมายเหตุ: ขั้นตอนนี้ตรวจจับกฎใน Repository เท่านั้น ไม่ใช่การยืนยันความปลอดภัยของ Firebase ที่ Deploy จริง
      # Workflow จะผ่านได้ก็ต่อเมื่อล้มเหลวเพราะ Security Assertion Failure เท่านั้น หากเกิดจาก Emulator crash ต้องรายงาน CI ล้มเหลว
      - name: 2. Audit Repository Rules (Detect Insecure Rules in Repo - Must Fail Assertions)
        run: |
          set +e
          LOG_FILE=$(mktemp)
          npx firebase-tools --config firebase.test.json emulators:exec --project audit-os-test-isolation --only firestore "npm run test:rules" 2>&1 | tee "$LOG_FILE"
          EXEC_EXIT_CODE=${PIPESTATUS[0]}
          set -e

          echo ""
          echo "=== REPOSITORY RULES AUDIT VERIFICATION ==="

          # 1. ตรวจสอบว่าต้องไม่ผ่าน เพราะกฎเปิด Public (allow read, write: if true) จะต้องถูก Assertions ปฏิเสธ
          if [ $EXEC_EXIT_CODE -eq 0 ]; then
            echo "::error::Repository rules test unexpectedly PASSED! Insecure rules (allow read, write: if true) must fail security assertions."
            exit 1
          fi

          # 2. ตรวจสอบข้อผิดพลาดของ Infrastructure / Runtime / Emulator เป็นลำดับแรก
          # หากมีข้อผิดพลาดจากการเปิด Emulator, Java, Network, หรือ Node runtime ต้องถือว่าการทดสอบล้มเหลวจริง
          if grep -E -i -q "ECONNREFUSED|Could not spawn|TypeError: fetch failed|Cannot find module|SyntaxError|UnhandledPromiseRejection" "$LOG_FILE"; then
            echo "::error::Test suite execution failed due to an environment, runtime, or emulator startup error — NOT a verified assertion failure."
            exit 1
          fi

          # 3. ยอมรับผลเฉพาะเมื่อยืนยันได้ว่าเป็นการล้มเหลวจาก Security Assertion ที่คาดไว้เท่านั้น
          if grep -q "Expected request to fail, but it succeeded" "$LOG_FILE" && grep -q -E "[0-9]+ failing" "$LOG_FILE"; then
            echo "✅ CONFIRMED: Test suite successfully detected insecure repository rules via expected security assertion failure."
            echo "✅ Evidence: Observed 'Expected request to fail, but it succeeded.' with verified Mocha test failure."
          else
            echo "::error::Could not reliably verify that the failure was caused by security assertions. Inspect log for details."
            exit $EXEC_EXIT_CODE
          fi
        env:
          FIRESTORE_EMULATOR_HOST: "127.0.0.1:8080"
          TARGET_RULES_FILE: "firestore.rules"
